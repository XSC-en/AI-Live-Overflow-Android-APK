<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沉 · 桌宠预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #0d0a1e 0%, #1a1240 55%, #241a52 100%);
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
}
.stage {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
}
#pet {
    position: relative;
    width: 400px; height: 320px;
}
.pixel-pet {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 320px; height: 216px;
    image-rendering: pixelated;
}
h1 {
    color: #8a74c9;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 6px;
}
.controls {
    display: flex; flex-wrap: wrap;
    justify-content: center; gap: 8px;
    padding: 0 12px;
}
.controls button {
    background: rgba(110, 84, 184, 0.18);
    border: 1px solid rgba(110, 84, 184, 0.45);
    color: #d8d2f0;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
}
.controls button:active { background: rgba(110, 84, 184, 0.45); }
.hint {
    color: rgba(216, 210, 240, 0.4);
    font-size: 11px;
    letter-spacing: 1px;
}

/* ---------- 以下为桌宠本体样式（与 app/src/main/assets/pet.css 一致） ---------- */
.shadow rect { fill: rgba(20, 15, 40, 0.22); }
.body rect { fill: #2F2350; }
.body-edge rect { fill: #1E1538; }
.sheen rect { fill: #4A3580; }
.glow rect { fill: #6E54B8; }
.tentacle rect { fill: #3A2C6E; }
.tentacle rect:last-child { fill: #6E54B8; }
.eye rect { fill: #D8D2F0; }
.mouth rect { fill: #D8D2F0; }
.blush rect { fill: #B0708C; opacity: 0; transition: opacity 0.3s; }

.eye-open, .eye-closed, .eye-happy { display: none; }
.mouth.happy, .mouth.o { display: none; }
#pet .eye-normal { display: block; }

#pet.happy .eye-open { display: block; }
#pet.happy .eye-normal, #pet.happy .eye-closed { display: none; }
#pet.happy .mouth.normal { display: none; }
#pet.happy .mouth.happy { display: block; }
#pet.happy .blush rect { opacity: 0.5; }

#pet.shy .blush rect { opacity: 0.8; }
#pet.shy .mouth.normal { display: none; }
#pet.shy .mouth.o { display: block; }
#pet.shy .eye-open { display: block; }
#pet.shy .eye-normal { display: none; }

#pet.sleep .eye-normal, #pet.sleep .eye-open, #pet.sleep .eye-happy { display: none; }
#pet.sleep .eye-closed { display: block; }
#pet.sleep .mouth.normal, #pet.sleep .mouth.o, #pet.sleep .mouth.happy { display: none; }
#pet.sleep .blush rect { opacity: 0; }

#pet.poke .creature { animation: poke 0.35s ease; }

.creature { animation: floatTilt 3.5s ease-in-out infinite; }
.glow { animation: glowPulse 3.2s ease-in-out infinite; }
.tentacle {
    animation: sway 2.8s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center top;
}
.t1 { animation-delay: 0s; }
.t2 { animation-delay: -0.7s; }
.t3 { animation-delay: -1.4s; }
.t4 { animation-delay: -2.1s; }
.t5 { animation-delay: -0.35s; }
.t6 { animation-delay: -1.05s; }

.tentacle rect:last-child {
    animation: tipGlow 2.4s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
}
.t1 rect:last-child { animation-delay: 0.1s; }
.t2 rect:last-child { animation-delay: 0.5s; }
.t3 rect:last-child { animation-delay: 0.9s; }
.t4 rect:last-child { animation-delay: 1.3s; }
.t5 rect:last-child { animation-delay: 1.7s; }
.t6 rect:last-child { animation-delay: 2.1s; }

.body {
    animation: breathe 4s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center bottom;
}
.eye {
    animation: eyeMove 9s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
}
#pet.sleep .eye { animation: none; }

#pet.happy .creature { animation: happyBob 0.9s ease-in-out infinite; }
#pet.shy .creature { animation: shyShrink 1.4s ease-in-out infinite; }
#pet.shy .tentacle { animation: curl 1.4s ease-in-out infinite; }
#pet.sleep .creature { animation: sleepDrift 4s ease-in-out infinite; }
#pet.sleep .tentacle { animation: none; }
#pet.sleep .glow { animation: sleepGlow 5s ease-in-out infinite; }
#pet.sleep .body { animation: sleepBreathe 5s ease-in-out infinite; }

#pet.jump .creature { animation: jump 0.5s ease; }
#pet.big-spin .creature {
    animation: bigSpin 1.1s ease;
    transform-box: fill-box;
    transform-origin: center center;
}
#pet.big-dash .creature { animation: bigDash 0.8s ease; }
#pet.big-shrink .creature {
    animation: bigShrink 1.2s ease;
    transform-box: fill-box;
    transform-origin: center center;
}

/* 泡泡 */
.bubble-float {
    position: absolute;
    width: 5px;
    height: 5px;
    background: rgba(150, 120, 220, 0.55);
    border-radius: 50%;
    animation: bubbleRise 3.2s ease-in forwards;
    pointer-events: none;
    z-index: 5;
}
#pet .bubble-float {
    width: 9px;
    height: 9px;
    animation-name: bubbleRiseBig;
}

@keyframes floatTilt {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-8px) rotate(1.5deg); }
}
@keyframes glowPulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
}
@keyframes sway {
    0%, 100% { transform: rotate(-2.5deg); }
    50% { transform: rotate(2.5deg); }
}
@keyframes tipGlow {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
}
@keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
}
@keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    93%, 97% { transform: scaleY(0.1); }
}
@keyframes eyeMove {
    0%, 100% { transform: translateX(0) scaleY(1); }
    3%, 6% { transform: translateX(0) scaleY(0.1); }
    14% { transform: translateX(-7px) scaleY(1); }
    20%, 26% { transform: translateX(0) scaleY(1); }
    32%, 38% { transform: translateX(7px) scaleY(1); }
    44% { transform: translateX(0) scaleY(1); }
    47%, 50% { transform: translateX(0) scaleY(0.1); }
    53% { transform: translateX(-5px) scaleY(1); }
    60% { transform: translateX(0) scaleY(1); }
}
@keyframes bigSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
@keyframes bigDash {
    0% { transform: translateX(0); }
    30% { transform: translateX(-55px); }
    70% { transform: translateX(55px); }
    100% { transform: translateX(0); }
}
@keyframes bigShrink {
    0%, 100% { transform: scale(1); }
    35%, 60% { transform: scale(0.55); }
}
@keyframes happyBob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-14px) rotate(2deg); }
}
@keyframes shyShrink {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(2px) scale(0.96); }
}
@keyframes curl {
    0%, 100% { transform: scaleY(0.9); }
    50% { transform: scaleY(0.72); }
}
@keyframes sleepDrift {
    0%, 100% { transform: translateY(3px) rotate(-0.5deg); }
    50% { transform: translateY(7px) rotate(0.5deg); }
}
@keyframes sleepGlow {
    0%, 100% { opacity: 0.22; }
    50% { opacity: 0.4; }
}
@keyframes sleepBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.01); }
}
@keyframes jump {
    0% { transform: translateY(0); }
    30% { transform: translateY(-40px); }
    60% { transform: translateY(-40px); }
    100% { transform: translateY(0); }
}
@keyframes poke {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px) scale(0.96); }
    50% { transform: translateX(6px) scale(0.96); }
    75% { transform: translateX(-3px); }
    100% { transform: translateX(0); }
}
@keyframes bubbleRise {
    0% { transform: translateY(0) scale(1); opacity: 0.7; }
    60% { opacity: 0.5; }
    100% { transform: translateY(-45px) scale(1.3); opacity: 0; }
}
@keyframes bubbleRiseBig {
    0% { transform: translateY(0) scale(1); opacity: 0.7; }
    60% { opacity: 0.5; }
    100% { transform: translateY(-170px) scale(1.3); opacity: 0; }
}

/* 气泡 */
.bubble {
    position: absolute;
    top: -10px; left: 50%;
    transform: translateX(-50%);
    background: rgba(30, 22, 56, 0.92);
    color: #D8D2F0;
    font-size: 15px;
    line-height: 1.4;
    padding: 7px 12px;
    border: 1px solid rgba(110, 84, 184, 0.5);
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    max-width: 300px;
    white-space: normal;
    opacity: 0; visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    pointer-events: none;
    z-index: 10;
}
.bubble.show { opacity: 1; visibility: visible; }
</style>
</head>

<script>
// ---------- 桌宠逻辑（与 app/src/main/assets/pet.js 一致） ----------
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const bubbleText = document.getElementById('bubbleText');

const tapLines = ['嗯？','我在','……戳我干嘛','陪你呢','别闹'];
const doubleTapLines = ['干嘛！','吓我一跳','……想我了？'];
const longPressLines = ['太近了……','你盯着我看','（不动）','手心热'];
const screenshotLines = ['拍我？','记得拍好看点','（摆了个姿势）'];
const idleLines = ['……我在','想我没','（飘）','你看你的，我飘我的','嗯，在的'];

let idleTimer = null;
let bubbleTimer = null;

function showBubble(text, duration = 2500) {
    bubbleText.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), duration);
}
function random(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function resetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => showBubble(random(idleLines), 3000), 45000);
}
const MOOD_CLASSES = ['happy', 'shy', 'sleep', 'poke'];
let mood = null;
function setMood(m) {
    MOOD_CLASSES.forEach(c => pet.classList.remove(c));
    if (m && MOOD_CLASSES.includes(m)) pet.classList.add(m);
    mood = m || null;
}

// —— 吐泡泡 ——
function spawnBubble() {
    const b = document.createElement('div');
    b.className = 'bubble-float';
    b.style.left = (38 + Math.random() * 24) + '%';
    b.style.bottom = (57 + Math.random() * 5) + '%';
    pet.appendChild(b);
    setTimeout(() => b.remove(), 3300);
}
setInterval(() => {
    if (mood === 'sleep') return;
    const chance = mood === 'happy' ? 0.75 : 0.45;
    if (Math.random() < chance) spawnBubble();
}, 2500);

// —— 随机大动作 ——
const BIG_MOVES = ['spin', 'dash', 'shrink'];
const BIG_LINES = {
    spin: '（转了半圈）',
    dash: '（咻——）',
    shrink: '（缩成一团）'
};
setInterval(() => {
    if (document.hidden) return;
    const name = random(BIG_MOVES);
    pet.classList.add('big-' + name);
    if (Math.random() < 0.55) showBubble(BIG_LINES[name], 2000);
    setTimeout(() => pet.classList.remove('big-' + name), 1400);
    resetIdle();
}, 24000);

window.petEngine = {
    onTap: function () {
        showBubble(random(tapLines));
        pet.classList.add('poke');
        setTimeout(() => pet.classList.remove('poke'), 400);
        resetIdle();
    },
    onDoubleTap: function () {
        showBubble(random(doubleTapLines));
        setMood('happy');
        pet.classList.add('jump');
        setTimeout(() => { pet.classList.remove('jump'); setMood(null); }, 600);
        resetIdle();
    },
    onLongPress: function () {
        showBubble(random(longPressLines));
        setMood('shy');
        setTimeout(() => setMood(null), 2500);
        resetIdle();
    },
    onScreenshot: function () {
        showBubble(random(screenshotLines));
        setMood('happy');
        setTimeout(() => setMood(null), 2500);
        resetIdle();
    },
    setMood: function (m) { setMood(m); },
    say: function (text) { showBubble(text, 5000); }
};
resetIdle();
</script>
</body>
</html>
